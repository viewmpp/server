services:

  server-db:
    ports:
      - "127.0.0.1:5432:5432"

  server:
    environment:
      PROXIES: '1'

  caddy:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./remote/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    depends_on:
      server:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
