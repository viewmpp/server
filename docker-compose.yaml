name: mpp-viewer

services:
  server-db:
    image: postgres:17
    container_name: server-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    networks:
      - internal
    volumes:
      - server-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  parser:
    build:
      context: ../parser
    image: parser:local
    container_name: parser
    restart: unless-stopped
    read_only: true
    networks:
      - internal
    tmpfs:
      - /tmp
    mem_limit: 1536m
    environment:
      ENV: ${ENV:-dev}
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s


  migrate:
    image: migrate/migrate:v4.19.1
    container_name: migrate
    restart: "no"
    networks:
      - internal
    volumes:
      - ./migrations:/migrations
    command:
      - -path
      - /migrations
      - -database
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@server-db:5432/${POSTGRES_DB}?sslmode=disable
      - up
    depends_on:
      server-db:
        condition: service_healthy

  server:
    build: .
    image: server:local
    container_name: server
    restart: unless-stopped
    networks:
      - internal
      - edge
    env_file:
      - .env
    environment:
      PORT: '4000'
      DB_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@server-db:5432/${POSTGRES_DB}?sslmode=disable
      PARSER_URL: http://parser:8080/parse
    stop_grace_period: 40s
    depends_on:
      server-db:
        condition: service_healthy
      parser:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

networks:
  internal:
    internal: true
  edge:

volumes:
  server-db-data:
