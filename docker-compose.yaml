services:
  server-db:
    image: postgres:17
    container_name: server-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - server-db-data:/var/lib/postgresql/data

  parser:
    build:
      context: ../parser
    image: parser:local
    container_name: parser
    restart: on-failure
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1536m
    env_file:
      - ../parser/.env
    ports:
      - '127.0.0.1:8080:8080'
    healthcheck:
      test: [ "CMD", "curl", "-f", "localhost:8080/healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s

volumes:
  server-db-data: